# Parity backend stack. Host networking, but every service binds to 127.0.0.1
# only: nothing is reachable from outside the host. The frontend (reverse proxy)
# is the sole public entrypoint; a firewall (ufw) is the second layer.
# Databases stay in the cloud (configured via .env).
services:
  # ---- API (FastAPI engines) ----
  api:
    build: .
    image: parity-api
    network_mode: host
    # Bind to loopback: only the co-located reverse proxy reaches the API.
    command: ["uvicorn", "api.main:app", "--host", "127.0.0.1", "--port", "8000"]
    env_file:
      - .env
    # On the VM the engines reach the co-located services over loopback.
    environment:
      XI_REDIS_URL: redis://127.0.0.1:6379/0
      XI_MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      XI_SPARK_MASTER: spark://127.0.0.1:7077
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    mem_limit: 640m
    restart: unless-stopped

  # ---- Redis (FX cache + rate limiter for the engines) ----
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data
    mem_limit: 192m
    restart: unless-stopped

  # ---- MLflow tracking server ----
  mlflow:
    build: ./mlflow
    image: parity-mlflow
    network_mode: host
    environment:
      MLFLOW_HOST: 127.0.0.1
    volumes:
      - mlflowdata:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 1g
    restart: unless-stopped

  # ---- Apache Spark (standalone master) ----
  spark-master:
    image: apache/spark:3.5.3
    network_mode: host
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - 127.0.0.1
      - --port
      - "7077"
      - --webui-port
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/7077' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    restart: unless-stopped

  # ---- Apache Spark (worker) ----
  spark-worker:
    image: apache/spark:3.5.3
    network_mode: host
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://127.0.0.1:7077
      - --cores
      - "2"
      - --memory
      - 1G
      - --webui-port
      - "8081"
    depends_on:
      spark-master:
        condition: service_healthy
    mem_limit: 1400m
    restart: unless-stopped

volumes:
  redisdata:
  mlflowdata:
