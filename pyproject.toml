[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xi"
version = "0.6.1"
description = "Currency risk simulation engine for importers and e-commerce merchants"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dotenv = [
    "python-dotenv>=1,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
db = [
    "sqlalchemy>=2,<3",
    "psycopg2-binary>=2.9,<3",
    "pymongo>=4.6,<5",
    "neo4j>=5.16,<6",
]
ai = [
    "groq>=1.2,<2",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "python-dotenv>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "sqlalchemy>=2,<3",
    "psycopg2-binary>=2.9,<3",
    "pymongo>=4.6,<5",
    "neo4j>=5.16,<6",
    "groq>=1.2,<2",
    "ruff==0.15.12",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "build>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "db/tests", "ai/tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.setuptools.packages.find]
include = ["core*", "api*", "db*", "ai*"]
exclude = ["*.tests", "*.tests.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI uses callables (Depends) as argument defaults
    "E501",  # line length is owned by the formatter; only unsplittable strings remain
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["core", "api", "db", "ai"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# FastAPI response models coerce domain dataclasses at runtime; mypy can't see it.
module = "api.*"
disable_error_code = ["arg-type", "assignment"]

[tool.coverage.run]
source = ["core", "api", "db", "ai"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
