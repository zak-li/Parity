[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xi"
version = "0.9.1"
description = "Currency risk simulation engine for importers and e-commerce merchants"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6,<3",
    "pandas>=3.0.5,<4",
    "scipy>=1.17.1,<2",
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
dotenv = [
    "python-dotenv>=1.2.2,<2",
]
api = [
    "fastapi>=0.140.0,<1",
    "uvicorn>=0.51.0,<1",
    "prometheus-client>=0.26.0,<1",
    "redis>=8.0.1,<9",
    "PyJWT>=2.13.0,<3",
    "cryptography>=49.0.0",
]
db = [
    "sqlalchemy>=2.0.51,<3",
    "psycopg2-binary>=2.9.12,<3",
    "pymongo>=4.17.0,<5",
    "neo4j>=6.2.0,<7",
    "alembic>=1.18.5,<2",
]
ai = [
    "groq>=1.6.0,<2",
]
mlflow = [
    "mlflow>=3.14.0,<4",
]
spark = [
    "pyspark>=4.2.0,<5",
]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "python-dotenv>=1.2.2,<2",
    "fastapi>=0.140.0,<1",
    "uvicorn>=0.51.0,<1",
    "prometheus-client>=0.26.0,<1",
    "httpx>=0.28.1,<1",
    "sqlalchemy>=2.0.51,<3",
    "psycopg2-binary>=2.9.12,<3",
    "pymongo>=4.17.0,<5",
    "neo4j>=6.2.0,<7",
    "alembic>=1.18.5,<2",
    "groq>=1.6.0,<2",
    "ruff==0.16.0",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "build>=1.5.0",
    "PyJWT>=2.13.0,<3",
    "cryptography>=49.0.0",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "db/tests", "ai/tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.setuptools.packages.find]
include = ["core*", "api*", "db*", "ai*"]
exclude = ["*.tests", "*.tests.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI uses callables (Depends) as argument defaults
    "E501",  # line length is owned by the formatter; only unsplittable strings remain
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["core", "api", "db", "ai"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# FastAPI response models coerce domain dataclasses at runtime; mypy can't see it.
module = "api.*"
disable_error_code = ["arg-type", "assignment"]

[tool.coverage.run]
source = ["core", "api", "db", "ai"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
