[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Parity"
version = "1.0.0"
description = "Institutional FX risk simulation and hedging decision engine for corporate finance and importers"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["fx", "currency-risk", "monte-carlo", "hedging", "fintech", "garch", "risk-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=2.4.6,<3",
    "pandas>=3.0.5,<4",
    "scipy>=1.17.1,<2",
    "requests>=2.34.2,<3",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
]

[project.urls]
Homepage = "https://github.com/zak-li/Parity"
Repository = "https://github.com/zak-li/Parity"
Documentation = "https://github.com/zak-li/Parity#readme"
"Bug Tracker" = "https://github.com/zak-li/Parity/issues"

[project.scripts]
parity = "core.cli:main"
Parity = "core.cli:main"

[project.optional-dependencies]
dotenv = [
    "python-dotenv>=1.2.3,<2",
]
api = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.4,<1",
    "prometheus-client>=0.26.0,<1",
    "redis>=8.1.0,<9",
    "PyJWT>=2.13.0,<3",
    "cryptography>=50.0.1",
]
db = [
    "sqlalchemy>=2.0.52,<3",
    "psycopg2-binary>=2.9.12,<3",
    "pymongo>=4.17.0,<5",
    "neo4j>=6.2.0,<7",
    "alembic>=1.19.1,<2",
]
ai = [
    "groq>=1.7.0,<2",
]
mlflow = [
    "mlflow>=3.15.2,<4",
]
spark = [
    "pyspark>=4.2.0,<5",
]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "python-dotenv>=1.2.3,<2",
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.4,<1",
    "prometheus-client>=0.26.0,<1",
    "httpx>=0.28.1,<1",
    "sqlalchemy>=2.0.52,<3",
    "psycopg2-binary>=2.9.12,<3",
    "pymongo>=4.17.0,<5",
    "neo4j>=6.2.0,<7",
    "alembic>=1.19.1,<2",
    "groq>=1.7.0,<2",
    "ruff==0.16.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "build>=1.5.0",
    "PyJWT>=2.13.0,<3",
    "cryptography>=50.0.1",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "db/tests", "ai/tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.setuptools.packages.find]
include = ["sdk*", "parity*", "Parity*", "core*", "api*", "db*", "ai*"]
exclude = ["*.tests", "*.tests.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI uses callables (Depends) as argument defaults
    "E501",  # line length is owned by the formatter; only unsplittable strings remain
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["core", "api", "db", "ai"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# FastAPI response models coerce domain dataclasses at runtime; mypy can't see it.
module = "api.*"
disable_error_code = ["arg-type", "assignment"]

[tool.coverage.run]
source = ["core", "api", "db", "ai"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
